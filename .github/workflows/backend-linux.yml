name: Backend Linux verification
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify exported source manifest
        if: hashFiles('SOURCE_MANIFEST.json') != ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          for name, expected in json.loads(Path('SOURCE_MANIFEST.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PY
      - name: Build the deployment image
        run: docker build --tag vivacity-runtime:verification .
      - name: Run the full suite in the deployment image
        run: |
          mkdir -p artifacts
          TEST_FILES=$(python3 - <<'PY'
          from pathlib import Path
          files=sorted(Path('tests').glob('test_*.py'))
          shard=${{ matrix.shard }}
          # Spread the longest physical integrations across existing shards.
          # Each file is still assigned exactly once, keeping the full suite.
          heavy={'test_factory_benchmark.py':1, 'test_pick_place.py':4,
                 'test_humanoid_live.py':5, 'test_orbital.py':3,
                 'test_hierarchical_search.py':2, 'test_parallel_trials.py':1,
                 'test_cloth.py':5}
          selected=[f'/app/{path.as_posix()}' for index,path in enumerate(files)
                    if heavy.get(path.name,index%6)==shard]
          assert selected
          print(' '.join(selected))
          PY
          )
          # Each file gets a fresh Python process. MuJoCo models, video arrays,
          # and graphics contexts otherwise accumulate across unrelated files
          # and the full-image run can be killed by the runner (exit 137).
          index=0
          failed=0
          for test_file in $TEST_FILES; do
            # Bound a stalled test file so its failure is reported instead of
            # consuming the entire shard with no diagnostic result.
            if ! timeout --signal=TERM --kill-after=5s 600s docker run --rm -v "$PWD/tests:/app/tests:ro" -v "$PWD/artifacts:/verification" vivacity-runtime:verification python -m pytest "$test_file" -vv --tb=short --junitxml="/verification/backend-linux-${{ matrix.shard }}-$index.xml"; then
              failed=1
            fi
            index=$((index + 1))
          done
          exit "$failed"
      - name: Upload executed test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-verification-${{ matrix.shard }}
          path: artifacts/backend-linux-${{ matrix.shard }}-*.xml
      - name: Execute all labs within the free host memory limit
        if: matrix.shard == 0
        run: |
          docker run --rm --memory=512m --memory-swap=512m -v "$PWD/tests:/app/tests:ro" -v "$PWD/artifacts:/verification" vivacity-runtime:verification python -m pytest /app/tests/test_host_capacity.py /app/tests/test_factory_host_capacity.py -s -vv --junitxml=/verification/host-memory.xml
      - name: Upload memory-limit evidence
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: host-memory-verification
          path: artifacts/host-memory.xml
      - name: Execute all humanoid tasks within the free host memory limit
        if: matrix.shard == 0
        run: |
          docker run --rm --memory=512m --memory-swap=512m -v "$PWD/tests:/app/tests:ro" -v "$PWD/artifacts:/verification" vivacity-runtime:verification python -m pytest /app/tests/test_humanoid_host_capacity.py -s -vv --junitxml=/verification/humanoid-host-memory.xml
      - name: Upload humanoid memory-limit evidence
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-host-memory-verification
          path: artifacts/humanoid-host-memory.xml
